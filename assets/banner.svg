<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Credit Scoring AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="170" fill="#ffffff" opacity="0.04"/>
  <circle cx="120" cy="320" r="150" fill="#ffffff" opacity="0.05"/>

  <text x="70" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#ffffff">Credit Scoring AI</text>
  <text x="70" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#bfdbfe">From raw data to an explainable, deployed risk decision</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">
    <rect x="70" y="212" width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.15"/>
    <text x="136" y="237" text-anchor="middle">scikit-learn</text>
    <rect x="214" y="212" width="118" height="38" rx="19" fill="#ffffff" fill-opacity="0.15"/>
    <text x="273" y="237" text-anchor="middle">Streamlit</text>
    <rect x="344" y="212" width="96" height="38" rx="19" fill="#ffffff" fill-opacity="0.15"/>
    <text x="392" y="237" text-anchor="middle">Docker</text>
    <rect x="452" y="212" width="132" height="38" rx="19" fill="#ffffff" fill-opacity="0.15"/>
    <text x="518" y="237" text-anchor="middle">GitHub CI</text>
  </g>

  <g transform="translate(870 80)">
    <path d="M0 150 A130 130 0 0 1 260 150" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="26" stroke-linecap="round"/>
    <path d="M0 150 A130 130 0 0 1 260 150" fill="none" stroke="url(#arc)" stroke-width="26" stroke-linecap="round" stroke-dasharray="330 408"/>
    <text x="130" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">742</text>
    <text x="130" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#bfdbfe">CREDIT SCORE</text>
  </g>
</svg>
